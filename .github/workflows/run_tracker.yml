name: Hyperliquid Wallet Tracker

on:
  schedule:
    # 每小时第 18 分钟运行一次 (UTC)，每月预算 ~720 分钟，远低于 2000 免费额度
    - cron: '18 * * * *'
  workflow_dispatch:
    # 允许在 GitHub Web UI 中手动触发执行

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    permissions:
      # 允许工作流向仓库提交/推送文件 (用于保存 seen_trades.json)
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Tracker Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python hyperliquid_polling_tracker.py

    - name: Commit and Push Seen Trades History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add seen_trades.json || true
        # 仅当 seen_trades.json 文件发生实际改变时才进行提交与推送
        if git diff --staged --quiet; then
          echo "No changes in seen_trades.json. Skipping commit."
        else
          git commit -m "chore: auto-update seen_trades.json history [skip ci]"
          git push
        fi
