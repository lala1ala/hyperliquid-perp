name: Hyperliquid Wallet Tracker

on:
  schedule:
    # 每30分钟第18和48分钟各运行一次 (UTC)，公开仓库无限免费
    - cron: '18,48 * * * *'
  workflow_dispatch:
    # 允许在 GitHub Web UI 中手动触发执行

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    permissions:
      # 允许工作流向仓库提交/推送文件 (seen_trades.json + hl_tracker_config.json)
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Tracker Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python hyperliquid_polling_tracker.py

    - name: Commit and Push Data Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add seen_trades.json hl_tracker_config.json || true
        if git diff --staged --quiet; then
          echo "No data changes. Skipping commit."
        else
          git commit -m "chore: auto-update tracking data [skip ci]"
          git push
        fi
